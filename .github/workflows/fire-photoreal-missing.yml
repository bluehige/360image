name: Fire Photoreal Missing Frames

on:
  pull_request:
    branches:
      - main
    paths:
      - 'fire_generation/generate_single.py'
      - '.github/workflows/fire-photoreal-missing.yml'

permissions:
  contents: read

jobs:
  generate-single:
    if: github.head_ref == 'temp/fire-extinguisher-final-run'
    strategy:
      fail-fast: false
      matrix:
        frame: [4, 5, 9, 10, 14, 15, 19, 20]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generation client
        run: python -m pip install --upgrade gradio_client pillow

      - name: Generate F${{ matrix.frame }}
        shell: bash
        run: |
          mkdir -p fire_output
          set -o pipefail
          python fire_generation/generate_single.py '${{ matrix.frame }}' 2>&1 | tee fire_output/runner_F${{ matrix.frame }}.log

      - name: Upload frame artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-photoreal-F${{ matrix.frame }}
          path: fire_output/**
          if-no-files-found: warn
          retention-days: 3
