name: Fire Photoreal Second-Pass Repairs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'fire_repair2/repair2_frame.py'
      - '.github/workflows/fire-photoreal-repair2.yml'

permissions:
  contents: read
  actions: read

jobs:
  repair2-frame:
    if: github.head_ref == 'temp/fire-extinguisher-repair2-run'
    strategy:
      fail-fast: false
      matrix:
        frame: [3, 5, 8, 9, 15, 17, 20, 22, 23]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download main baseline artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bluehige/360image
          run-id: 32680283285
          pattern: fire-photoreal-*
          path: baseline_main
          merge-multiple: true

      - name: Download missing-frame baseline artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bluehige/360image
          run-id: 32680659060
          pattern: fire-photoreal-F*
          path: baseline_missing
          merge-multiple: true

      - name: Download first-pass repair artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bluehige/360image
          run-id: 32681257250
          pattern: fire-repaired-F*
          path: baseline_repair1
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generation client
        run: python -m pip install --upgrade gradio_client pillow

      - name: Repair F${{ matrix.frame }} second pass
        shell: bash
        run: |
          mkdir -p repair2_output
          set -o pipefail
          python fire_repair2/repair2_frame.py '${{ matrix.frame }}' 2>&1 | tee repair2_output/runner_F${{ matrix.frame }}.log

      - name: Upload second-pass frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-repair2-F${{ matrix.frame }}
          path: repair2_output/**
          if-no-files-found: warn
          retention-days: 3
