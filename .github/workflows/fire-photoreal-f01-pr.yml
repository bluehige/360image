name: Fire Photoreal F01 PR Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'fire_ref/**'
      - '.github/workflows/fire-photoreal-f01-pr.yml'

permissions:
  contents: read

jobs:
  generate-f01:
    if: github.head_ref == 'temp/fire-extinguisher-photoreal-final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generation client
        run: python -m pip install --upgrade gradio_client pillow

      - name: Generate F01
        shell: bash
        run: |
          mkdir -p fire_output
          set -o pipefail
          python fire_ref/generate_f01.py 2>&1 | tee fire_output/runner.log

      - name: Upload F01 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-photoreal-f01-pr
          path: fire_output/**
          if-no-files-found: warn
          retention-days: 3
