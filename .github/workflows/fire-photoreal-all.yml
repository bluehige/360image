name: Fire Photoreal F01-F23 Generation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'fire_ref/F00_ref_256.jpg'
      - 'fire_generation/generate_batch.py'
      - '.github/workflows/fire-photoreal-all.yml'

permissions:
  contents: read

jobs:
  generate-batch:
    if: github.head_ref == 'temp/fire-extinguisher-final-run'
    strategy:
      fail-fast: false
      matrix:
        batch: ['01-05', '06-10', '11-15', '16-20', '21-23']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generation client
        run: python -m pip install --upgrade gradio_client pillow

      - name: Generate ${{ matrix.batch }}
        shell: bash
        run: |
          mkdir -p fire_output
          set -o pipefail
          python fire_generation/generate_batch.py '${{ matrix.batch }}' 2>&1 | tee fire_output/runner_${{ matrix.batch }}.log

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-photoreal-${{ matrix.batch }}
          path: fire_output/**
          if-no-files-found: warn
          retention-days: 3
